name: Scrape Events and Update Feeds

on:
  schedule:
    # Run daily at 6 AM UTC
    - cron: '0 6 * * *'
  workflow_dispatch: # Allow manual triggering

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Run scrapers
        run: |
          python scrape.py
      
      - name: Copy feeds to docs directory for GitHub Pages
        run: |
          cp output/*.ics docs/ 2>/dev/null || true
      
      - name: Commit and push if changed
        run: |
          git config user.name "GitHub Actions Bot"
          git config user.email "actions@github.com"
          git add output/*.ics docs/*.ics
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update event feeds [automated]" && git push)
